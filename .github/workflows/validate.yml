name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: Validate with HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ --cov=custom_components.postnl --cov-fail-under=95 -v

  ruff:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ruff
        uses: astral-sh/ruff-action@v4.1.0

  translations:
    name: Validate translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare translation structures
        run: python .github/scripts/check_translations.py custom_components/postnl/translations

  policy:
    name: Check suite policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check repository policy
        run: python .github/scripts/check_policy.py

      - name: Check commit messages
        if: github.actor != 'dependabot[bot]'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "No pushed commit range to validate."
            exit 0
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            commit_range="$BASE_SHA..$PR_HEAD_SHA"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            commit_range="$HEAD_SHA^..$HEAD_SHA"
          else
            commit_range="$BEFORE..$HEAD_SHA"
          fi
          python .github/scripts/check_commit_messages.py "$commit_range"
