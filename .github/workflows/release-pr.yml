name: Prepare release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only calculate the next release; do not create or update a PR.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: release-pr-main
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Calculate release PR
        id: release
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MANIFEST_PATH: custom_components/postnl/manifest.json
        with:
          script: |
            const prepare = require("./.github/scripts/release_manager.js");
            await prepare({ github, context, core });

      - name: Require release bot token
        if: steps.release.outputs.has_release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          test -n "$RELEASE_BOT_TOKEN" || {
            echo "RELEASE_BOT_TOKEN is required to let the release PR trigger normal PR checks." >&2
            exit 1
          }

      - name: Create or update release PR
        if: steps.release.outputs.has_release == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          base: main
          branch: automation/release
          delete-branch: true
          commit-message: Bump version to ${{ steps.release.outputs.version }}
          title: Bump version to ${{ steps.release.outputs.version }}
          body: ${{ steps.release.outputs.notes }}
          add-paths: custom_components/postnl/manifest.json
          draft: false
