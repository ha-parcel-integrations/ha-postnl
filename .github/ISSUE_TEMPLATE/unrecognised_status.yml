name: 🏷️ Unrecognised parcel status
description: The integration logged a warning asking you to report an unrecognised status or event.
title: "[status] "
labels: ["unrecognised-status"]
assignees:
  - peternijssen
body:
  - type: markdown
    attributes:
      value: |
        The integration logs a line such as
        `[parcel] statusPhase.message=… → reported as 'unknown'` or
        `[history] observationCode=… text=… → reported as 'unknown'`.
        Paste that full line below and we'll add it to the mapping.
  - type: textarea
    id: logline
    attributes:
      label: The log line
      description: Copy the full "help us map it" warning line from your Home Assistant log.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "e.g. 4.3.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.7.0"
  - type: markdown
    attributes:
      value: |
        ### 💡 Even better: attach a diagnostics file

        A diagnostics download shows us the exact payload behind the warning —
        usually all we need to fix the mapping, with no back-and-forth.

        1. In Home Assistant, open **Settings → Devices & services**.
        2. Open this integration, then click the **⋮** (three dots) on its entry.
        3. Choose **Download diagnostics**.
        4. Open the file and check it before attaching. Home Assistant redacts
           known personal fields, but that list is per-integration and can
           miss something an API happens to return in an unlisted place (a
           name, an address, a link containing a tracking number). Please
           hand-redact anything that still looks personal.
        5. Drag the file onto this issue to attach it.
